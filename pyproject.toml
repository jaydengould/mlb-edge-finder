[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-win-probability"
version = "0.1.0"
description = "Calibrated MLB game-level win probability model with a daily automated pipeline and a published prediction history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jayden Gould", email = "jaydengould28@gmail.com" }]
keywords = ["mlb", "baseball", "win-probability", "calibration", "xgboost", "sports-analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pybaseball>=2.2",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "python-dotenv>=1.0",
    "MLB-StatsAPI>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "notebook>=7.0",
]

[project.urls]
Homepage = "https://github.com/jaydengould/mlb-win-probability"
Dashboard = "https://jaydengould.github.io/mlb-win-probability/"

[tool.setuptools.packages.find]
where = ["src"]
